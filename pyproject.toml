[project]
name = "aionpulse"
version = "0.1.0b1"
description = "Passive local AION2 combat meter with party overlay"
requires-python = ">=3.12"
dependencies = ["lz4==4.4.5"]
license = {text = "GPL-3.0-only"}

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
ignore = ["E402"]
